<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drums Routine</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --accent: #c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #eeeeee; --muted: #999; --accent: #ff6b5b; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box; text-align: center;
    }
    h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); font-size: 1.1rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Drums Routine</h1>
    <p>準備中 — 練習ルーティンを譜面で表示するツール</p>
    <p><a href="https://github.com/yoshiwatanabe/drums-routine/blob/main/PRD.md">PRD を読む</a></p>
  </main>
</body>
</html>
