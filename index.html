<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drums Routine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="prev" aria-label="前のルーティン">‹</button>
    <h1><button id="routine-title" aria-label="目次を開く"></button></h1>
    <span id="counter"></span>
    <button id="fav" aria-label="お気に入り">☆</button>
    <button id="next" aria-label="次のルーティン">›</button>
  </header>
  <main id="items"></main>
  <div id="toc" hidden>
    <nav>
      <div class="toc-head">
        <span>目次</span>
        <button id="toc-close" aria-label="閉じる">×</button>
      </div>
      <ol id="toc-list"></ol>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <script src="expand.js"></script>
  <script src="routines.js"></script>
  <script src="test-routines.js"></script>
  <script src="app.js"></script>
</body>
</html>
